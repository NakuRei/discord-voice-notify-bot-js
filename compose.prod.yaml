services:
  bot:
    container_name: discord-voice-notify-bot-js-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env.prod
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
